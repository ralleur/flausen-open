model:
  default: deepseek-flash
  provider: deepseek
  base_url: https://api.deepseek.com
  context_length: 1000000
  reasoning_effort: high
tools:
  tool_search:
    enabled: "off"
compression:
  enabled: false
agent:
  max_turns: 10
  run_budget_seconds: 300
  disabled_toolsets:
    - delegation
    - terminal
    - code_execution
    - web
    - browser
    - cronjob
memory:
  memory_enabled: false
  user_profile_enabled: false
